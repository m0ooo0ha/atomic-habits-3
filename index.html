<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة الأسئلة الجماعية</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>🎯 لعبة الأسئلة الجماعية</h1>
    <p class="subtitle">أضف اللاعبين وابدأ التحدي! اللاعب الأعلى نقاطًا يفوز.</p>

    <section class="card" id="setup-card">
      <h2>الإعداد</h2>
      <div class="row">
        <input id="player-name" type="text" placeholder="اسم اللاعب" />
        <button id="add-player">إضافة لاعب</button>
      </div>
      <ul id="players-list" class="players-list"></ul>
      <button id="start-game" class="primary" disabled>ابدأ اللعبة</button>
    </section>

    <section class="card hidden" id="game-card">
      <h2 id="turn-label"></h2>
      <div id="question-box">
        <p id="question-text"></p>
        <div id="answers" class="answers"></div>
      </div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="primary hidden">السؤال التالي</button>
    </section>

    <section class="card hidden" id="score-card">
      <h2>النتائج</h2>
      <ol id="score-list"></ol>
      <button id="restart">إعادة اللعب</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
